<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruise Lab Docs</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  nav a { display: block; padding: 4px 0; text-decoration: none; }
  nav a.on { font-weight: 650; }
  article { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 24px 24px; min-width: 0; overflow-x: auto; }
  article table { border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  article th, article td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; vertical-align: top; }
  article th { background: var(--bg); }
  article code { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; background: var(--bg); padding: 0 3px; border-radius: 3px; }
  article pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
  article pre code { background: none; padding: 0; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="brand">Cruise Lab <span>documentation</span></div><div class="controls"><a href="/">← viewer</a></div></header>
<div class="wrap">
  <nav id="nav"></nav>
  <article id="doc">Loading…</article>
</div>
<script>
const DOCS = [['README.md', 'Overview'], ['01_how_it_works.md', '1. How a flight is generated'],
  ['02_anomalies.md', '2. Anomalies: types, injection, timing'], ['03_channels.md', '3. Logged channels'],
  ['04_viewer.md', '4. Using the viewer'], ['05_data_format.md', '5. Data files & scripts'], ['06_qcd_dataset.md', '6. QCD training dataset']];
const nav = document.getElementById('nav');
function show(f) {
  nav.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.f === f));
  fetch('/docs/' + f).then((r) => r.text()).then((t) => {
    document.getElementById('doc').innerHTML = marked.parse(t);
    document.querySelectorAll('#doc a[href$=".md"]').forEach((a) => {
      const target = a.getAttribute('href').split('/').pop();
      a.onclick = (e) => { e.preventDefault(); location.hash = target; };
    });
  });
}
DOCS.forEach(([f, t]) => { const a = document.createElement('a'); a.href = '#' + f; a.dataset.f = f; a.textContent = t; nav.append(a); });
window.onhashchange = () => show(location.hash.slice(1) || DOCS[0][0]);
show(location.hash.slice(1) || DOCS[0][0]);
</script>
</body>
</html>
